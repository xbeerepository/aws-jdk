schema-version: 1.0

description: |
  Installs Amazon Corretto 25.0.4.7.1 from a versioned archive, verified
  against the SHA-256 published in the official release:
  https://github.com/corretto/corretto-25/releases/tag/25.0.4.7.1
  Tested target: Linux/amd64. The release checksum for Linux/arm64 is also
  provided. Changing xbee.version requires updating archiveSha256 as well.
  Requires an xbee guest binary supporting url.sha256.

const:
  javaHome: "{{ .xbee.install }}/jdk"

var:
  xbee:
    version: "25.0.4.7.1"
  archiveSha256:
    amd64: 1d03a3bd5091728492d92f0ef341aca7d8885ece9a150119558f3e3d62b58745
    arm64: 90a07c1c693ac9333a8a6ec79432f0d13c0564fec6617b0222d43f86858f65b8
  
provision:
  - url:
      from: https://corretto.aws/downloads/resources/{{ .xbee.version }}/amazon-corretto-{{ .xbee.version }}-linux-{{ mapArch .xbee.arch }}.tar.gz
      sha256: '{{ index .archiveSha256 .xbee.arch }}'
    after: "{{ .xbee.templates }}/link.sh"
  - env: JAVA_HOME={{ .javaHome }}
  - systempath: "{{ .javaHome }}/bin"
command:
  javac: javac
  java: java

